[package]
name = "collector"
version.workspace = true
edition.workspace = true

[dependencies]
user-agent = { path = "../../crates/user-agent" }
dotenvy = "0.15.7"
axum = "0.8.7"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1.5"
regex = "1.12.2"
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.11"
aes-gcm = "0.11.0"
hex = "0.4.3"
sourcemap = "9.3.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "macros", "uuid", "json"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
zstd = "0.13.3"
tower-http = { version = "0.7.0", features = ["cors", "decompression-gzip", "decompression-zstd", "decompression-deflate", "decompression-br"] }
url = "2"
moka = { version = "0.12.12", features = ["sync", "future"] }
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-sdk-s3 = { version = "1.107.0", features = ["behavior-version-latest"] }

[dev-dependencies]
tempfile = "3"
