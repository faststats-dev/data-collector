[package]
name = "rrweb2video"
version.workspace = true
edition.workspace = true
description = "Frame-stepped rrweb to MP4 renderer driven by Rust"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = "3"
tungstenite = "0.28"

[lints.rust]
unsafe_code = "forbid"

