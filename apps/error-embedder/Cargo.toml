[package]
name = "error-embedder"
version = "0.1.0"
edition = "2024"

[dependencies]
stack-trace-parser = { path = "../../crates/stack-trace-parser" }
anyhow = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
hex = "0.4"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "tokio", "zstd"] }
redis = { version = "1.7.0", default-features = false, features = ["tokio-rustls-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
