[package]
name = "replay-summarizer"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
aws-sdk-s3 = { version = "1.149.0", features = ["behavior-version-latest"] }
base64 = "0.23"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
replay-message = { path = "../../crates/replay-message" }
replay-render-protocol = { path = "../../crates/replay-render-protocol" }
reqwest = { version = "0.13.5", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "io-util", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
zstd = "0.14.0"
