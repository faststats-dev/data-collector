[package]
name = "replay-renderer"
version.workspace = true
edition.workspace = true
default-run = "replay-renderer"
description = "Isolated rrweb video rendering service"

[dependencies]
anyhow = "1"
axum = "0.8.9"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2"
replay-render-protocol = { path = "../../crates/replay-render-protocol" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "process", "io-util", "sync", "net", "fs"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
