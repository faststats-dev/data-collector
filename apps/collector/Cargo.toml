[package]
name = "collector"
version.workspace = true
edition.workspace = true

[dependencies]
user-agent = { path = "../../crates/user-agent" }
rrweb-types = { path = "../../crates/rrweb-types" }
stack-trace-parser = { path = "../../crates/stack-trace-parser" }
legacy-grouping = { path = "../../crates/legacy-grouping" }
replay-message = { path = "../../crates/replay-message" }
collector-message = { path = "../../crates/collector-message" }
dotenvy = "0.15.7"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
aes-gcm = "0.11.1"
hex = "0.4.3"
symbolicator = { path = "../../crates/symbolicator" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
zstd = "0.14.0"
tower-http = { version = "0.7.1", features = ["cors", "decompression-gzip", "decompression-zstd", "decompression-deflate", "decompression-br"] }
url = "2.5.8"
moka = { version = "0.12.16", features = ["future"] }
reqwest = "0.13.5"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
rdkafka = { version = "0.39.0", features = ["cmake-build", "sasl", "ssl", "zstd"] }
aws-sdk-s3 = { version = "1.149.0", features = ["behavior-version-latest"] }
