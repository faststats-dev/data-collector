[package]
name = "data-collector"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
axum = "0.8.7"
chrono = "0.4"
flate2 = "1.1.5"
parking_lot = "0.12"
rand = "0.9"
regex = "1.12.2"
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "time"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
zstd = "0.13.3"
tower-http = { version = "0.6.8", features = ["cors"] }
